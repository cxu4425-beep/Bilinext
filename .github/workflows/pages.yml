# Publishes the front end to GitHub Pages.
#
# Only the front end: GitHub Pages serves static files, and BiliNext needs a
# running server to sign requests and proxy media. The published page asks for
# that server's address on first run. Pages is HTTPS-only and browsers refuse
# to call http:// from an https:// page, so the address must be https too --
# see "從 GitHub Pages 使用" in the README.
name: Deploy front end to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run should replace an older one rather than fight it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
